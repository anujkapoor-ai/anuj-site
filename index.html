<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anuj Kapoor</title>
<meta name="description" content="Anuj Kapoor: venture and product builder across technology, economics, innovation, strategy and policy. Founder of GreenPeople.earth and Five Benches.">
<meta property="og:title" content="Anuj Kapoor">
<meta property="og:description" content="I go where technology is rewriting economics and markets, and build there.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one mosaic of tiles in different sizes; the introduction is the large gold tile. Each tile carries a faint illustration of its subject and opens a reading panel.
   All content comes from profile.json. */
:root {
  /* Palette: charcoal, gold, white and grey */
  --paper: #F3F3F1;
  --surface: #FCFCFB;
  --tile: #E7E9EA;
  --tile-work: #E6E8EA;
  --tile-life: #F2EADB;
  --ink: #16191D;
  --muted: #4A5056;
  --line: #CDD1D4;
  --pine: #2C3238;
  --pine-ink: #16191D;
  --accent: #C68A26;
  --accent-ink: #855A0E;
  --holi: #855A0E;
  --band: #16191D;
  --charcoal: #3B4148;
  --charcoal-ink: #F3F2ED;
  --band-ink: #F4F2EC;
  --scrim: rgba(22, 25, 29, .5);
  --glow-warm: rgba(205, 150, 55, .16);
  --glow-cool: rgba(120, 128, 136, .10);
  --glow-holi: rgba(205, 150, 55, .08);
  --contour: #C9CDD1;
  --contour-alpha: .38;
  --tile-alpha: 94%;
  --display: "Source Serif 4", "Georgia", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101215; --surface: #181B1F; --tile: #1C2024; --tile-work: #1C2024; --tile-life: #2A241A;
    --ink: #ECEDEE; --muted: #A8AEB4; --line: #2E3339;
    --pine: #C9CED3; --pine-ink: #ECEDEE; --accent: #E2AE4E; --accent-ink: #EDC373; --holi: #EDC373;
    --band: #2A241A; --band-ink: #F4F0E6; --charcoal: #2C3238; --charcoal-ink: #EEEDE8; --scrim: rgba(0,0,0,.62);
    --glow-warm: rgba(226, 174, 78, .08); --glow-cool: rgba(150, 160, 170, .05); --glow-holi: rgba(226, 174, 78, .05);
    --contour: #2A2F35; --contour-alpha: .55; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --paper: #101215; --surface: #181B1F; --tile: #1C2024; --tile-work: #1C2024; --tile-life: #2A241A;
    --ink: #ECEDEE; --muted: #A8AEB4; --line: #2E3339;
    --pine: #C9CED3; --pine-ink: #ECEDEE; --accent: #E2AE4E; --accent-ink: #EDC373; --holi: #EDC373;
    --band: #2A241A; --band-ink: #F4F0E6; --charcoal: #2C3238; --charcoal-ink: #EEEDE8; --scrim: rgba(0,0,0,.62);
    --glow-warm: rgba(226, 174, 78, .08); --glow-cool: rgba(150, 160, 170, .05); --glow-holi: rgba(226, 174, 78, .05);
    --contour: #2A2F35; --contour-alpha: .55; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { position: relative; background: radial-gradient(1100px 620px at 88% -8%, var(--glow-warm), transparent 62%), radial-gradient(900px 800px at -12% 55%, var(--glow-cool), transparent 60%), radial-gradient(1000px 700px at 110% 105%, var(--glow-holi), transparent 60%), var(--paper); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
#terrain { position: absolute; top: 0; left: 0; width: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 3.5vw, 36px); padding-block: clamp(20px, 4vw, 40px) 48px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a { color: inherit; }

/* Mosaic: 12 columns, tiles of different widths and heights packed densely */
.mosaic { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: minmax(100px, auto); grid-auto-flow: dense; gap: 12px; }
.mosaic > * { min-width: 0; }
.main-col { min-width: 0; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
.h1 { grid-row: span 1; } .h2 { grid-row: span 2; } .h3 { grid-row: span 3; } .h6 { grid-row: span 6; }
@media (max-width: 960px) {
  .mosaic { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .mosaic > .tile { grid-column: span 3; grid-row: span 2; }
  .mosaic > .tile.wide-md, .mosaic > .tile.w12 { grid-column: span 6; }
  .hero.w8 { grid-column: span 6; grid-row: auto; }
}
@media (max-width: 600px) {
  .mosaic { grid-template-columns: 1fr; grid-auto-rows: auto; }
  .mosaic > .tile, .mosaic > .tile.wide-md, .hero.w8 { grid-column: 1 / -1; grid-row: auto; min-height: 150px; }
}

/* Hero box */
.hero { position: relative; overflow: hidden; border-radius: 16px; padding: clamp(22px, 3.4vw, 40px); background: color-mix(in srgb, var(--tile-life) 92%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); display: flex; flex-direction: column; justify-content: center; }
.hero > *:not(.motif) { position: relative; z-index: 1; }
.coords { font: 12.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.coords b { color: var(--accent-ink); font-weight: 500; }
h1 { color: var(--ink); font-family: var(--display); font-weight: 600; font-size: clamp(42px, 5.6vw, 72px); line-height: 1; letter-spacing: -.015em; margin: 14px 0 8px; }
.role { font: 600 clamp(17px, 1.9vw, 20px) var(--body); letter-spacing: .01em; margin: 0 0 6px; }
.domains { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 0; margin: 0 0 20px; padding: 0; list-style: none; font: 500 13.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.domains li + li::before { content: "|"; color: var(--accent); margin: 0 10px; }
.thesis { font-family: var(--display); font-weight: 500; font-size: clamp(22px, 2.4vw, 28px); line-height: 1.28; max-width: 30ch; text-wrap: balance; margin: 0 0 14px; }
.thesis em { font-style: italic; color: var(--accent-ink); }
.strap { color: var(--muted); max-width: 62ch; margin: 0 0 18px; font-size: 16.5px; }
.caps { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; padding: 0; list-style: none; }
.caps li { font: 500 14px var(--body); padding: 5px 12px; border-radius: 999px; background: var(--surface); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }
.contact { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pill { font: 13px var(--mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 13px; border-radius: 999px; text-decoration: none; cursor: pointer; }
.pill:hover { border-color: var(--accent); }
.worknote { font-size: 15px; color: var(--muted); margin: 14px 0 0; }
.worknote a { color: var(--accent-ink); text-underline-offset: 3px; }

/* Tiles */
.tile {
  position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: color-mix(in srgb, var(--tile-work) var(--tile-alpha), transparent); border: 1px solid transparent; border-radius: 14px;
  padding: 18px 20px;
}
.tile.t-grey { background: color-mix(in srgb, var(--tile-work) var(--tile-alpha), transparent); }
.tile.t-gold { background: color-mix(in srgb, var(--tile-life) var(--tile-alpha), transparent); border-color: color-mix(in srgb, var(--accent) 22%, transparent); }
.tile.t-light { background: var(--surface); border-color: var(--line); }
.tile.t-dark { background: var(--charcoal); color: var(--charcoal-ink); }
.tile.t-black { background: var(--band); color: var(--band-ink); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.tile > *:not(.motif) { position: relative; z-index: 1; }
.tile .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.tile .kick { font: 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tile h3 { font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.2; margin: 4px 0 0; text-wrap: balance; }
.tile.big h3 { font-size: 22px; }
.tile .meta { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
.tile p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; max-width: 34ch; padding-right: 36px; }
.tile .go { position: absolute; right: 14px; bottom: 14px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 14px; color: var(--ink); background: var(--surface); z-index: 2; }
.tile .draftdot { font: 12px var(--mono); color: var(--accent-ink); white-space: nowrap; }
.tile.t-dark .kick, .tile.t-dark p, .tile.t-dark .meta, .tile.t-black .kick, .tile.t-black p, .tile.t-black .meta { color: color-mix(in srgb, var(--charcoal-ink) 80%, transparent); }
.tile.t-dark .go, .tile.t-black .go { background: transparent; color: #F2F1EC; border-color: rgba(242, 241, 236, .35); }
.tile.t-dark .draftdot, .tile.t-black .draftdot { color: #E2AE4E; }
.tile:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .tile { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
  .tile .motif { transition: transform .5s ease, opacity .3s ease; }
  .tile .go { transition: transform .2s ease, background .2s ease; }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 14px 28px -18px rgba(22, 25, 29, .5); }
  .tile:hover .motif { transform: scale(1.05); opacity: .55; }
  .tile:hover .go { transform: rotate(-45deg); background: var(--accent); color: #16191D; border-color: var(--accent); }
}
/* Faint illustration behind each tile: an image of what the tile is about */
.motif { position: absolute; right: -3%; top: 8%; width: 58%; height: 60%; z-index: 0; pointer-events: none; color: var(--accent); opacity: .34; }
.tile.h3 .motif { height: 55%; }
.tile.h1 .motif { top: 0; height: 100%; width: 45%; opacity: .26; }
.hero .motif { top: auto; width: 44%; height: 60%; right: -2%; bottom: -3%; opacity: .3; }
.tile.t-dark .motif, .tile.t-black .motif { color: #E2AE4E; opacity: .4; }
.tile.w12 .motif { width: 30%; height: 80%; top: 10%; }
.tile.w12 p { max-width: 60ch; }
@media (max-width: 600px) { .motif { opacity: .2 !important; width: 50%; } .hero .motif { display: none; } }
.tile.has-cover { color: #F4F6F8; background-size: cover; background-position: center; }
.tile.has-cover::before { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(14, 18, 22, .2), rgba(14, 18, 22, .78)); }
.tile.has-cover .kick, .tile.has-cover p, .tile.has-cover .meta { color: rgba(244, 246, 248, .86); }
.tile.has-cover .motif { display: none; }
.hint { font: 12px var(--mono); color: var(--muted); text-align: right; margin: 0 0 10px; }
@media (max-width: 600px) { .hint { text-align: left; } }

/* Panel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.panel { position: fixed; z-index: 21; inset: 0; margin: auto; width: min(820px, calc(100% - 32px)); height: min(88vh, 880px); background: var(--surface); color: var(--ink); border-radius: 16px; border: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0,0,0,.45); }
@media (max-width: 600px) { .panel { width: 100%; height: 100%; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } }
.panel.dark { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: clamp(20px, 3.5vw, 32px) clamp(20px, 4vw, 40px) 10px; }
.p-top .k { font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.panel.dark .p-top .k { color: color-mix(in srgb, var(--band-ink) 70%, transparent); }
.p-top h2 { font-family: var(--display); font-weight: 600; font-size: clamp(28px, 4vw, 40px); line-height: 1.12; margin: 0; text-wrap: balance; }
.x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: inherit; font-size: 20px; cursor: pointer; }
.x:hover { border-color: var(--accent); }
.p-body { flex: 1; overflow-y: auto; padding: 8px clamp(20px, 4vw, 40px) 32px; display: grid; gap: 18px; align-content: start; overscroll-behavior: contain; }
.p-body > p { margin: 0; max-width: 66ch; }
.p-body .lede { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2.2vw, 23px); line-height: 1.4; max-width: 40ch; margin-top: 4px; }
.muted { color: var(--muted); }
.panel.dark .muted { color: color-mix(in srgb, var(--band-ink) 75%, transparent); }
.p-foot { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 12px clamp(16px, 3vw, 26px); }
.panel.dark .p-foot { border-color: color-mix(in srgb, var(--band-ink) 20%, transparent); }
.nav { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; text-align: left; padding: 6px 4px; border-radius: 8px; max-width: 48%; min-width: 0; }
.nav.next { text-align: right; }
.nav small { display: block; font: 11.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.panel.dark .nav small { color: color-mix(in srgb, var(--band-ink) 65%, transparent); }
.nav span { font-family: var(--display); font-weight: 600; font-size: 18px; }
.nav:hover span { color: var(--accent-ink); }
.panel.dark .nav:hover span { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .scrim.in { animation: fade .25s ease both; }
  .panel.in { animation: rise .35s cubic-bezier(.2,.8,.2,1) both; }
  .p-body.swap { animation: swap .28s ease both; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(20px) scale(.98); } }
@keyframes swap { from { opacity: 0; transform: translateX(var(--dx, 14px)); } }

/* Content pieces */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 13px var(--mono); }
.chain span { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; }
.chain i { font-style: normal; color: var(--accent-ink); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.rows li { display: grid; grid-template-columns: 8em minmax(0,1fr); gap: 16px; padding-block: 14px; border-top: 1px solid var(--line); }
.rows li:last-child { border-bottom: 1px solid var(--line); }
.rows .when { font: 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.rows strong { font-weight: 600; }
.rows .sub { display: block; color: var(--muted); margin-top: 2px; }
@media (max-width: 520px) { .rows li { grid-template-columns: 1fr; gap: 2px; } }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font: 14px var(--body); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; color: var(--ink); }
.groups { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
@media (max-width: 600px) { .groups { grid-template-columns: 1fr; } }
.groups h3 { font: 600 15px var(--body); color: var(--accent-ink); margin: 0; }
.panel.dark .groups h3 { color: var(--accent); }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mini { border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
.mini h3 { font-family: var(--display); font-weight: 600; font-size: 17px; line-height: 1.25; margin: 0; }
.mini .yr { font: 12.5px var(--mono); color: var(--muted); }
.mini h3 a { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.mini h3 a:hover { color: var(--accent-ink); }
.mini p { margin: 0; color: var(--muted); font-size: 16px; }
.panel.dark .mini { border-color: color-mix(in srgb, var(--band-ink) 22%, transparent); }
.panel.dark .mini h3 { color: var(--accent); }
.panel.dark .mini p { color: color-mix(in srgb, var(--band-ink) 82%, transparent); }
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 18px; }
.pubs li { padding-left: 14px; font-weight: 500; border-left: 2px solid var(--accent); }
.pubs li.plain { border-left-color: var(--line); }
.pubs a { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.pubs a:hover { color: var(--accent-ink); }
.pubs .src { font-weight: 400; display: block; font: 12.5px var(--mono); color: var(--muted); }
.pubs .desc { font-weight: 400; display: block; color: var(--muted); font-size: 15.5px; margin-top: 2px; max-width: 64ch; }
.media { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.media figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.media img, .media video, .media iframe { width: 100%; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); display: block; }
.media iframe { aspect-ratio: 16 / 9; height: auto; }
.media figcaption { font: 12.5px var(--mono); color: var(--muted); }
.media.single { grid-template-columns: 1fr; }
.draft { justify-self: start; font: 11.5px var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink); border: 1px dashed var(--accent); border-radius: 4px; padding: 3px 8px; }
.panel.dark .draft { color: var(--accent); }
.loading { color: var(--muted); font: 13px var(--mono); }
/* Gold tree in the right margin, outside the tiles; leaves fall slowly as tokens */
.tree-rail { display: none; }
@media (min-width: 1260px) {
  .wrap { max-width: 1440px; display: grid; grid-template-columns: minmax(0, 1fr) 210px; column-gap: 24px; }
  .tree-rail { display: block; position: relative; }
}
.tree-sticky { position: sticky; top: 32px; width: 100%; aspect-ratio: 200 / 560; }
.tree-sticky svg.tree { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tree .limb path { fill: none; stroke: url(#gold-sheen); stroke-linecap: round; stroke-linejoin: round; }
.tree .leaf { fill: color-mix(in srgb, var(--accent) 20%, transparent); stroke: url(#gold-sheen); stroke-width: .8; }
.tree .rib { stroke: url(#gold-sheen); stroke-width: .5; opacity: .8; }
.tree .ground { stroke: url(#gold-sheen); stroke-width: 1; opacity: .5; }
.token-leaf { position: absolute; width: 11%; aspect-ratio: 24 / 32; opacity: 0; pointer-events: none; }
.token-leaf svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 1px 2px rgba(198, 138, 38, .35)); }
.token-leaf .lf { fill: color-mix(in srgb, var(--accent) 28%, var(--surface)); stroke: var(--accent); stroke-width: 1.1; }
.token-leaf .tk { font: 700 11px var(--display); fill: var(--accent-ink); }
.tl1 { left: 10%; top: 40%; --dx: 34px; --dy: 340px; animation: fall 20s ease-in-out 0s infinite; }
.tl2 { left: 80%; top: 37%; --dx: -40px; --dy: 360px; animation: fall 24s ease-in-out 8s infinite; }
.tl3 { left: 86%; top: 52%; --dx: -26px; --dy: 250px; animation: fall 22s ease-in-out 15s infinite; }
@keyframes fall {
  0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
  6%   { opacity: 1; }
  25%  { transform: translate(calc(var(--dx) * .25 + 14px), calc(var(--dy) * .25)) rotate(35deg); }
  50%  { transform: translate(calc(var(--dx) * .5 - 14px), calc(var(--dy) * .5)) rotate(-25deg); }
  75%  { transform: translate(calc(var(--dx) * .75 + 12px), calc(var(--dy) * .75)) rotate(30deg); }
  90%  { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(70deg); }
}
@media (prefers-reduced-motion: reduce) {
  .token-leaf { animation: none; opacity: 1; }
  .tl1 { transform: translate(16px, 150px) rotate(25deg); }
  .tl2 { transform: translate(-18px, 230px) rotate(-20deg); }
  .tl3 { display: none; }
}
footer { margin-top: 28px; font: 12.5px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }
</style>
</head>
<body>

<canvas id="terrain" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="main-col">
  <p class="hint" id="hint"></p>
  <main class="mosaic" id="mosaic">

      var cls = ['tile', 'w' + (t.w || 4), 'h' + (t.h || 2), s.group ? 'g-' + s.group : '', t.tone ? 't-' + t.tone : '', t.wideTablet ? 'wide-md' : '', t.cover ? 'has-cover' : '', (t.w || 4) * (t.h || 2) >= 12 ? 'big' : ''].join(' ').replace(/\s+/g, ' ').trim();
      var tile = h('button', { class: cls, 'data-id': s.id, type: 'button' }, [
        h('div', null, [
          h('div', { class: 'top' }, [h('span', { class: 'kick', text: GROUP_LABEL[s.group] || '' }), s.draft ? h('span', { class: 'draftdot', text: '● draft' }) : (t.meta ? h('span', { class: 'meta', text: t.meta }) : null)]),
          h('h3', { text: t.title })
        ]),
        t.teaser ? h('p', { text: t.teaser }) : null,
        h('span', { class: 'go', 'aria-hidden': 'true', text: '→' })
      ]);
      if (t.cover) tile.style.backgroundImage = 'url("' + String(t.cover).replace(/"/g, '') + '")';
      var m = motif(t.motif); if (m) tile.insertBefore(m, tile.firstChild);
      tile.addEventListener('click', function () { open(s.id, tile); });
      mosaic.appendChild(tile);
    });
    wireEmail();
    draw();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    var hash = (location.hash || '').slice(1);
    if (byId[hash]) open(hash);
  }

  var panel = $('panel'), scrim = $('scrim'), pBody = $('p-body'), prev = $('p-prev'), next = $('p-next');
  var current = null, opener = null;
  function fill(id, dir) {
    var s = byId[id];
    $('p-kicker').textContent = s.panel.kicker;
    $('p-title').textContent = s.panel.title;
    pBody.textContent = '';
    (s.blocks || []).forEach(function (b) { var fn = blocks[b.type]; if (fn) pBody.appendChild(fn(b)); });
    if (s.draft) pBody.appendChild(h('span', { class: 'draft', text: s.draft }));
    pBody.scrollTop = 0;
    panel.classList.toggle('dark', s.tile.tone === 'black');
    var i = order.indexOf(id), p = order[(i - 1 + order.length) % order.length], n = order[(i + 1) % order.length];
    prev.textContent = ''; prev.append(h('small', { text: '← Previous' }), h('span', { text: byId[p].tile.title }));
    next.textContent = ''; next.append(h('small', { text: 'Next →' }), h('span', { text: byId[n].tile.title }));
    if (dir) { pBody.style.setProperty('--dx', dir > 0 ? '14px' : '-14px'); pBody.classList.remove('swap'); void pBody.offsetWidth; pBody.classList.add('swap'); }
    current = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  function open(id, from) {
    opener = from || null; fill(id);
    scrim.hidden = false; panel.hidden = false;
    scrim.classList.remove('in'); panel.classList.remove('in'); void panel.offsetWidth;
    scrim.classList.add('in'); panel.classList.add('in');
    document.body.classList.add('locked'); $('p-close').focus();
  }
  function close() {
    scrim.hidden = true; panel.hidden = true; document.body.classList.remove('locked');
    var back = opener || document.querySelector('.tile[data-id="' + current + '"]');
    current = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (back) back.focus();
  }
  function step(d) { var i = order.indexOf(current); fill(order[(i + d + order.length) % order.length], d); }
  $('p-close').addEventListener('click', close);
  scrim.addEventListener('click', close);
  prev.addEventListener('click', function () { step(-1); });
  next.addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (!current) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') {
      var f = panel.querySelectorAll('button, a[href], video, iframe'); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  var sx = null;
  panel.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  panel.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) step(dx < 0 ? 1 : -1); sx = null; });

  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    Array.prototype.forEach.call(document.querySelectorAll('.tree animateTransform'), function (a) { a.remove(); });
  }

  function wireEmail() {
    var btn = $('copy-email'); if (!btn) return;
    var email = btn.textContent;
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = email; }, 1600); };
      var fallback = function () { var r = document.createRange(); r.selectNodeContents(btn); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(email).then(done, fallback); } catch (e) { fallback(); }
    });
  }

  /* topographic background: contour lines of a smooth terrain, drawn once per size/theme */
  var c = $('terrain'), drawTimer = null;
  function draw() {
    var W = document.documentElement.clientWidth, H = Math.max(document.documentElement.scrollHeight, innerHeight);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    c.style.height = H + 'px'; c.width = W * dpr; c.height = H * dpr;
    var x = c.getContext('2d'); x.setTransform(dpr, 0, 0, dpr, 0, 0); x.clearRect(0, 0, W, H);
    var st = getComputedStyle(document.documentElement);
    var line = st.getPropertyValue('--contour').trim(), acc = st.getPropertyValue('--accent').trim(), fade = parseFloat(st.getPropertyValue('--contour-alpha')) || .4;
    var peaks = [
      { x: .80 * W, y: 230, h: 1.0, s: 260 }, { x: .97 * W, y: 380, h: .7, s: 170 },
      { x: .08 * W, y: 980, h: .75, s: 300 }, { x: .62 * W, y: 1350, h: .8, s: 340 },
      { x: .30 * W, y: H - 220, h: .7, s: 320 }, { x: .95 * W, y: H - 520, h: .55, s: 240 }
    ];
    function f(px, py) {
      var v = 0;
      for (var k = 0; k < peaks.length; k++) { var p = peaks[k], dx = px - p.x, dy = py - p.y; v += p.h * Math.exp(-(dx * dx + dy * dy) / (2 * p.s * p.s)); }
      return v + .12 * Math.sin(px / 170 + py / 260) + .08 * Math.sin(px / 95 - py / 150);
    }
    var step = W < 600 ? 14 : 10, cols = Math.ceil(W / step) + 1, rows = Math.ceil(H / step) + 1, g = new Float32Array(cols * rows);
    for (var j = 0; j < rows; j++) for (var i = 0; i < cols; i++) g[j * cols + i] = f(i * step, j * step);
    function lerp(a, b, L) { return (L - a) / (b - a); }
    for (var n = 0; n < 15; n++) {
      var L = -0.05 + n * 0.075, hot = n === 10;
      x.beginPath(); x.strokeStyle = hot ? acc : line; x.globalAlpha = hot ? fade * .5 : fade; x.lineWidth = 1;
      for (var j2 = 0; j2 < rows - 1; j2++) for (var i2 = 0; i2 < cols - 1; i2++) {
        var a = g[j2 * cols + i2], b = g[j2 * cols + i2 + 1], cc = g[(j2 + 1) * cols + i2 + 1], d = g[(j2 + 1) * cols + i2];
        var idx = (a > L ? 8 : 0) | (b > L ? 4 : 0) | (cc > L ? 2 : 0) | (d > L ? 1 : 0);
        if (idx === 0 || idx === 15) continue;
        var X = i2 * step, Y = j2 * step;
        var top = [X + step * lerp(a, b, L), Y], right = [X + step, Y + step * lerp(b, cc, L)],
            bottom = [X + step * lerp(d, cc, L), Y + step], left = [X, Y + step * lerp(a, d, L)];
        var segs;
        switch (idx) {
          case 1: case 14: segs = [left, bottom]; break;
          case 2: case 13: segs = [bottom, right]; break;
          case 3: case 12: segs = [left, right]; break;
          case 4: case 11: segs = [top, right]; break;
          case 6: case 9: segs = [top, bottom]; break;
          case 7: case 8: segs = [left, top]; break;
          case 5: segs = [left, top, bottom, right]; break;
          case 10: segs = [left, bottom, top, right]; break;
        }
        for (var q = 0; q < segs.length; q += 2) { x.moveTo(segs[q][0], segs[q][1]); x.lineTo(segs[q + 1][0], segs[q + 1][1]); }
      }
      x.stroke();
    }
    x.globalAlpha = 1;
  }
  function redraw() { clearTimeout(drawTimer); drawTimer = setTimeout(draw, 120); }
  addEventListener('resize', redraw);
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
  try { new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}


  fetch('profile.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { $('mosaic').append(h('p', { class: 'loading', text: 'The profile could not be loaded. Check that profile.json is valid.' })); });
})();
</script>
