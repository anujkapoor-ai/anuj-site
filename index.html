<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anuj Kapoor</title>
<meta name="description" content="Anuj Kapoor: economist, former structurer at Citigroup and EFG, founder of GreenPeople.earth and Five Benches.">
<meta property="og:title" content="Anuj Kapoor">
<meta property="og:description" content="I go where economics is being rewritten by technology, and build there.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html, body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }

/* Layout: contour-map hero (Himalaya ⇄ London), then a 12-col menu of title tiles; each tile opens a reading panel with prev/next.
   All content comes from profile.json. */
:root {
  --paper: #EDF0F2;
  --surface: #F9FAFB;
  --tile: #E2E8EC;
  --ink: #16212B;
  --muted: #56636F;
  --line: #CBD3DA;
  --accent: #D9921C;
  --accent-ink: #8A5A0B;
  --band: #16212B;
  --band-ink: #EDF0F2;
  --scrim: rgba(22, 33, 43, .45);
  --display: "Gloock", "Georgia", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F161C; --surface: #17212A; --tile: #1C2833; --ink: #E5EBEF; --muted: #95A3AE;
    --line: #2A3743; --accent: #E8A93A; --accent-ink: #F0BC5E;
    --band: #E5EBEF; --band-ink: #0F161C; --scrim: rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0F161C; --surface: #17212A; --tile: #1C2833; --ink: #E5EBEF; --muted: #95A3AE;
  --line: #2A3743; --accent: #E8A93A; --accent-ink: #F0BC5E;
  --band: #E5EBEF; --band-ink: #0F161C; --scrim: rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body.locked { overflow: hidden; }
.wrap { max-width: 1160px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 0 56px; }

/* Hero */
.hero { position: relative; padding-block: clamp(44px, 8vw, 96px) clamp(32px, 5vw, 56px); }
#contours { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.hero > *:not(canvas) { position: relative; z-index: 1; }
.coords { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.coords b { color: var(--accent-ink); font-weight: 500; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(52px, 10vw, 112px); line-height: .95; letter-spacing: -.01em; margin: 20px 0 18px; }
.thesis { font-family: var(--display); font-size: clamp(22px, 3vw, 32px); line-height: 1.25; max-width: 22ch; text-wrap: balance; margin: 0 0 22px; }
.thesis em { font-style: normal; color: var(--accent-ink); }
.strap { color: var(--muted); max-width: 60ch; margin: 0 0 26px; }
.contact { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { font: 13px var(--mono); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; border-radius: 999px; text-decoration: none; cursor: pointer; }
.pill:hover, .pill:focus-visible { border-color: var(--accent); outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Menu */
.menu-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 18px; }
.menu-head h2 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; }
.menu-head p { margin: 0; font: 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.menu { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.tile {
  grid-column: span 4; min-height: 210px; min-width: 0;
  display: flex; flex-direction: column; justify-content: space-between; gap: 20px;
  text-align: left; font: inherit; color: var(--ink);
  background: var(--tile); border: 1px solid transparent; border-radius: 14px;
  padding: clamp(20px, 2.6vw, 28px); cursor: pointer; position: relative; overflow: hidden;
}
.tile.w6 { grid-column: span 6; } .tile.w8 { grid-column: span 8; } .tile.w12 { grid-column: span 12; min-height: 180px; }
.tile .k { font: 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.tile h3 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 2.8vw, 34px); line-height: 1.08; margin: 0 0 8px; text-wrap: balance; }
.tile p { margin: 0; color: var(--muted); max-width: 42ch; }
.tile .go { position: absolute; right: 22px; bottom: 20px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 16px; color: var(--ink); background: var(--surface); }
.tile .body { padding-right: 46px; }
.tile.dark { background: var(--band); color: var(--band-ink); }
.tile.dark .k, .tile.dark p { color: color-mix(in srgb, var(--band-ink) 72%, transparent); }
.tile.dark .go { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 35%, transparent); }
.tile .draftdot { color: var(--accent-ink); }
.tile.dark .draftdot { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .tile { transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s ease, border-color .2s ease; }
  .tile .go { transition: transform .25s ease, background .2s ease, color .2s ease; }
  .tile:hover { transform: translateY(-3px); box-shadow: 0 14px 30px -18px rgba(22,33,43,.45); }
  .tile:hover .go { transform: rotate(-45deg); background: var(--accent); color: #16212B; border-color: var(--accent); }
}
.tile:hover { border-color: var(--accent); }
@media (max-width: 900px) {
  .tile, .tile.w6, .tile.w8, .tile.w12 { grid-column: span 6; }
  .tile.wide-md { grid-column: span 12; }
}
@media (max-width: 600px) { .menu > .tile { grid-column: span 12; min-height: 160px; } }

/* Panel */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.panel {
  position: fixed; z-index: 21; inset: 0; margin: auto;
  width: min(880px, calc(100% - 32px)); height: min(88vh, 900px);
  background: var(--surface); color: var(--ink); border-radius: 18px; border: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.45);
}
@media (max-width: 600px) { .panel { width: 100%; height: 100%; border-radius: 0; border: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); } }
.panel.dark { background: var(--band); color: var(--band-ink); border-color: var(--band); }
.p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: clamp(20px, 3.5vw, 36px) clamp(20px, 4vw, 44px) 14px; }
.p-top .k { font: 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.panel.dark .p-top .k { color: color-mix(in srgb, var(--band-ink) 65%, transparent); }
.p-top h2 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 54px); line-height: 1.02; margin: 0; text-wrap: balance; }
.x { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: inherit; font-size: 20px; cursor: pointer; }
.x:hover { border-color: var(--accent); }
.p-body { flex: 1; overflow-y: auto; padding: 8px clamp(20px, 4vw, 44px) 32px; display: grid; gap: 18px; align-content: start; overscroll-behavior: contain; }
.p-body > p { margin: 0; max-width: 64ch; }
.p-body .lede { font-family: var(--display); font-size: clamp(20px, 2.4vw, 26px); line-height: 1.3; max-width: 30ch; }
.panel.dark .p-body .lede { color: var(--band-ink); }
.muted { color: var(--muted); }
.panel.dark .muted { color: color-mix(in srgb, var(--band-ink) 70%, transparent); }
.p-foot { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 14px clamp(16px, 3vw, 28px); }
.panel.dark .p-foot { border-color: color-mix(in srgb, var(--band-ink) 20%, transparent); }
.nav { font: inherit; background: none; border: 0; color: inherit; cursor: pointer; text-align: left; padding: 6px 4px; border-radius: 8px; max-width: 48%; min-width: 0; }
.nav.next { text-align: right; }
.nav small { display: block; font: 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.panel.dark .nav small { color: color-mix(in srgb, var(--band-ink) 60%, transparent); }
.nav span { font-family: var(--display); font-size: 19px; }
.nav:hover span { color: var(--accent-ink); }
.panel.dark .nav:hover span { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) {
  .scrim.in { animation: fade .25s ease both; }
  .panel.in { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
  .p-body.swap { animation: swap .3s ease both; }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }
@keyframes swap { from { opacity: 0; transform: translateX(var(--dx, 16px)); } }

/* Content pieces */
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font: 12.5px var(--mono); }
.chain span { padding: 4px 9px; border: 1px solid var(--line); border-radius: 999px; }
.chain i { font-style: normal; color: var(--accent-ink); }
.rows { list-style: none; margin: 0; padding: 0; display: grid; }
.rows li { display: grid; grid-template-columns: 8.5em minmax(0,1fr); gap: 16px; padding-block: 14px; border-top: 1px solid var(--line); }
.rows li:last-child { border-bottom: 1px solid var(--line); }
.rows .when { font: 12.5px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 4px; }
.rows strong { font-weight: 600; font-size: 17px; }
.rows .sub { display: block; color: var(--muted); margin-top: 2px; }
@media (max-width: 520px) { .rows li { grid-template-columns: 1fr; gap: 2px; } }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tag { font: 12.5px var(--mono); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; color: var(--ink); }
.groups { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px; }
@media (max-width: 600px) { .groups { grid-template-columns: 1fr; } }
.groups h3 { font: 500 11.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); margin: 0; }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mini { border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 6px; align-content: start; }
.mini h3 { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; margin: 0; }
.mini .yr { font: 12px var(--mono); color: var(--muted); }
.mini p { margin: 0; color: var(--muted); }
.panel.dark .mini { border-color: color-mix(in srgb, var(--band-ink) 22%, transparent); }
.panel.dark .mini h3 { font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.panel.dark .mini p { color: color-mix(in srgb, var(--band-ink) 80%, transparent); }
.pubs { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.pubs li { padding-left: 16px; border-left: 2px solid var(--accent); font-size: 17px; }
.pubs li.plain { border-left-color: var(--line); }
.pubs .src { display: block; font: 12px var(--mono); color: var(--muted); }
.draft { justify-self: start; font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); border: 1px dashed var(--accent); border-radius: 4px; padding: 3px 8px; }
.panel.dark .draft { color: var(--accent); }

footer { margin-top: 40px; font: 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; }

/* Cover images on tiles */
.tile.has-cover { color: #F4F6F8; background-size: cover; background-position: center; }
.tile.has-cover::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,21,28,.25), rgba(14,21,28,.78)); }
.tile.has-cover > * { position: relative; }
.tile.has-cover .k, .tile.has-cover p { color: rgba(244,246,248,.82); }
.tile.has-cover .go { background: transparent; color: #F4F6F8; border-color: rgba(244,246,248,.45); }

/* Media in panels */
.media { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.media figure { margin: 0; display: grid; gap: 6px; min-width: 0; }
.media img, .media video, .media iframe { width: 100%; max-width: 100%; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); display: block; }
.media iframe { aspect-ratio: 16 / 9; height: auto; }
.media figcaption { font: 12px var(--mono); color: var(--muted); }
.media.single { grid-template-columns: 1fr; }

.loading { padding-block: 40px; color: var(--muted); font: 13px var(--mono); }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <canvas id="contours" aria-hidden="true"></canvas>
    <div class="coords" id="coords"></div>
    <h1 id="name"></h1>
    <p class="thesis" id="thesis"></p>
    <p class="strap" id="strap"></p>
    <div class="contact" id="contact"></div>
  </header>

  <div class="menu-head"><h2 id="menu-title">Explore</h2><p>Open any card · ← → to move between them</p></div>
  <main class="menu" id="menu"><p class="loading">Loading…</p></main>

  <footer><span id="copyright"></span><span id="footer-note"></span></footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" hidden>
  <div class="p-top"><div><div class="k" id="p-kicker"></div><h2 id="p-title"></h2></div><button class="x" id="p-close" type="button" aria-label="Close">×</button></div>
  <div class="p-body" id="p-body"></div>
  <div class="p-foot"><button class="nav" id="p-prev" type="button"></button><button class="nav next" id="p-next" type="button"></button></div>
</section>

<script>
(function () {
  /* ---------- tiny DOM helper: all text goes in via textContent ---------- */
  function h(tag, attrs, kids) {
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      if (attrs[k] == null || attrs[k] === false) continue;
      if (k === 'class') el.className = attrs[k];
      else if (k === 'text') el.textContent = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function $(id) { return document.getElementById(id); }

  /* ---------- content blocks ---------- */
  var blocks = {
    lede: function (b) { return h('p', { class: 'lede', text: b.text }); },
    p: function (b) { return h('p', { class: b.muted ? 'muted' : null, text: b.text }); },
    chain: function (b) {
      var kids = [];
      b.items.forEach(function (t, i) { if (i) kids.push(h('i', { text: '→' })); kids.push(h('span', { text: t })); });
      return h('div', { class: 'chain' }, kids);
    },
    rows: function (b) {
      return h('ul', { class: 'rows' }, b.items.map(function (r) {
        return h('li', null, [
          h('span', { class: 'when', text: r.when || '' }),
          h('span', null, [
            h('strong', { text: r.title }),
            r.text ? h('span', { class: 'sub', text: r.text }) : null,
            r.tags ? tagList(r.tags) : null
          ])
        ]);
      }));
    },
    cards: function (b) {
      return h('div', { class: 'cards2' }, b.items.map(function (c) {
        return h('div', { class: 'mini' }, [
          c.label ? h('span', { class: 'yr', text: c.label }) : null,
          h('h3', { text: c.title }),
          c.text ? h('p', { text: c.text }) : null
        ]);
      }));
    },
    groups: function (b) {
      return h('div', { class: 'groups' }, b.items.map(function (g) {
        return h('div', null, [h('h3', { text: g.title }), tagList(g.tags)]);
      }));
    },
    tags: function (b) { return tagList(b.items); },
    list: function (b) {
      return h('ul', { class: 'pubs' }, b.items.map(function (it) {
        var title = it.url ? h('a', { href: it.url, target: '_blank', rel: 'noopener', text: it.title }) : it.title;
        return h('li', { class: it.featured ? null : 'plain' }, [title, it.source ? h('span', { class: 'src', text: it.source }) : null]);
      }));
    },
    media: function (b) {
      return h('div', { class: 'media' + (b.items.length === 1 ? ' single' : '') }, b.items.map(function (m) {
        var el;
        if (m.type === 'video') el = h('video', { src: m.src, controls: '', preload: 'metadata', playsinline: '', poster: m.poster });
        else if (m.type === 'youtube') el = h('iframe', { src: 'https://www.youtube-nocookie.com/embed/' + m.id, title: m.caption || 'Video', allow: 'encrypted-media; picture-in-picture', allowfullscreen: '', loading: 'lazy' });
        else el = h('img', { src: m.src, alt: m.alt || '', loading: 'lazy' });
        return h('figure', null, [el, m.caption ? h('figcaption', { text: m.caption }) : null]);
      }));
    }
  };
  function tagList(items) { return h('div', { class: 'tags' }, items.map(function (t) { return h('span', { class: 'tag', text: t }); })); }

  /* ---------- render page ---------- */
  var data, order = [], byId = {};
  function render(d) {
    data = d;
    document.title = d.name;
    $('name').textContent = d.name;
    var coords = $('coords');
    d.places.forEach(function (p, i) {
      if (i) coords.appendChild(h('span', { text: '⇄' }));
      coords.appendChild(h('span', null, [h('b', { text: p.coord }), ' ' + p.name]));
    });
    $('thesis').append(d.thesis.text + ' ', h('em', { text: d.thesis.emphasis }));
    $('strap').textContent = d.strap;
    var contact = $('contact');
    if (d.email) contact.appendChild(h('button', { class: 'pill', id: 'copy-email', type: 'button', text: d.email }));
    (d.links || []).forEach(function (l) { contact.appendChild(h('a', { class: 'pill', href: l.url, target: '_blank', rel: 'noopener', text: l.label + ' ↗' })); });
    $('menu-title').textContent = d.menuTitle || 'Explore';
    $('copyright').textContent = '© ' + new Date().getFullYear() + ' ' + d.name;
    $('footer-note').textContent = d.footer || '';

    var menu = $('menu'); menu.textContent = '';
    d.sections.forEach(function (s) {
      order.push(s.id); byId[s.id] = s;
      var t = s.tile;
      var cls = ['tile', t.size || 'w4', t.wideTablet ? 'wide-md' : '', t.dark ? 'dark' : '', t.cover ? 'has-cover' : ''].join(' ').trim();
      var tile = h('button', { class: cls, 'data-id': s.id, type: 'button' }, [
        h('div', { class: 'k' }, [h('span', { text: t.kicker }), s.draft ? h('span', { class: 'draftdot', text: '● draft' }) : (t.meta ? h('span', { text: t.meta }) : null)]),
        h('div', { class: 'body' }, [h('h3', { text: t.title }), t.teaser ? h('p', { text: t.teaser }) : null]),
        h('span', { class: 'go', 'aria-hidden': 'true', text: '→' })
      ]);
      if (t.cover) tile.style.backgroundImage = 'url("' + t.cover.replace(/"/g, '') + '")';
      tile.addEventListener('click', function () { open(s.id, tile); });
      menu.appendChild(tile);
    });
    wireEmail();
    draw();
    var hash = (location.hash || '').slice(1);
    if (byId[hash]) open(hash);
  }

  /* ---------- panel ---------- */
  var panel = $('panel'), scrim = $('scrim'), pBody = $('p-body'), prev = $('p-prev'), next = $('p-next');
  var current = null, opener = null;
  function shortLabel(id) { return byId[id].tile.kicker; }
  function fill(id, dir) {
    var s = byId[id];
    $('p-kicker').textContent = s.panel.kicker;
    $('p-title').textContent = s.panel.title;
    pBody.textContent = '';
    (s.blocks || []).forEach(function (b) { var fn = blocks[b.type]; if (fn) pBody.appendChild(fn(b)); });
    if (s.draft) pBody.appendChild(h('span', { class: 'draft', text: s.draft }));
    pBody.scrollTop = 0;
    panel.classList.toggle('dark', !!s.tile.dark);
    var i = order.indexOf(id), p = order[(i - 1 + order.length) % order.length], n = order[(i + 1) % order.length];
    prev.textContent = ''; prev.append(h('small', { text: '← Previous' }), h('span', { text: shortLabel(p) }));
    next.textContent = ''; next.append(h('small', { text: 'Next →' }), h('span', { text: shortLabel(n) }));
    if (dir) { pBody.style.setProperty('--dx', dir > 0 ? '16px' : '-16px'); pBody.classList.remove('swap'); void pBody.offsetWidth; pBody.classList.add('swap'); }
    current = id;
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }
  function open(id, from) {
    opener = from || null; fill(id);
    scrim.hidden = false; panel.hidden = false;
    scrim.classList.remove('in'); panel.classList.remove('in'); void panel.offsetWidth;
    scrim.classList.add('in'); panel.classList.add('in');
    document.body.classList.add('locked'); $('p-close').focus();
  }
  function close() {
    scrim.hidden = true; panel.hidden = true; document.body.classList.remove('locked');
    var back = opener || document.querySelector('.tile[data-id="' + current + '"]');
    current = null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (back) back.focus();
  }
  function step(d) { var i = order.indexOf(current); fill(order[(i + d + order.length) % order.length], d); }
  $('p-close').addEventListener('click', close);
  scrim.addEventListener('click', close);
  prev.addEventListener('click', function () { step(-1); });
  next.addEventListener('click', function () { step(1); });
  document.addEventListener('keydown', function (e) {
    if (!current) return;
    if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'Tab') {
      var f = panel.querySelectorAll('button, a[href], video, iframe'); if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  var sx = null;
  panel.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; }, { passive: true });
  panel.addEventListener('touchend', function (e) { if (sx === null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) step(dx < 0 ? 1 : -1); sx = null; });

  /* ---------- copy email ---------- */
  function wireEmail() {
    var btn = $('copy-email'); if (!btn) return;
    var email = btn.textContent;
    btn.addEventListener('click', function () {
      var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = email; }, 1600); };
      var fallback = function () { var r = document.createRange(); r.selectNodeContents(btn); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(email).then(done, fallback); } catch (e) { fallback(); }
    });
  }

  /* ---------- contour hero ---------- */
  var c = $('contours');
  function draw() {
    var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    var x = c.getContext('2d'); x.scale(dpr, dpr);
    var st = getComputedStyle(document.documentElement);
    var line = st.getPropertyValue('--line').trim(), acc = st.getPropertyValue('--accent').trim();
    var w = r.width, hh = r.height;
    for (var i = 0; i < 16; i++) {
      x.beginPath(); x.strokeStyle = i === 10 ? acc : line; x.globalAlpha = i === 10 ? .55 : .8; x.lineWidth = 1;
      for (var px = 0; px <= w; px += 6) {
        var t = px / w;
        var ridge = Math.exp(-Math.pow((t - .72) / .16, 2)) * hh * .42 + Math.exp(-Math.pow((t - .9) / .08, 2)) * hh * .18;
        var y = hh * .98 - i * hh * .045 - ridge * (1 - i / 22) + Math.sin(t * 9 + i * .7) * 5;
        px === 0 ? x.moveTo(px, y) : x.lineTo(px, y);
      }
      x.stroke();
    }
  }
  addEventListener('resize', draw);
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);

  /* ---------- load content ---------- */
  fetch('profile.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(function () { $('menu').textContent = 'The profile could not be loaded. Check that profile.json is valid.'; });
})();
</script>
</body>
</html>
